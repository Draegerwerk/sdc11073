codecov:
    notify:
        # do not notify until all test jobs of .github/workflows/build.yml have uploaded: python versions * os with the
        # wheel (5 * 2 = 10), plus the sdist job and the lowest-direct job = 12. Keep in sync with the test matrix.
        after_n_builds: 12 # https://docs.codecov.com/docs/codecovyml-reference#codecovnotify
coverage:
  status:
    project:
      default:
        target: auto # https://docs.codecov.com/docs/commit-status#target
        # test coverage may change a bit depending on the computer executed
        threshold: 2% # https://docs.codecov.com/docs/commit-status#threshold