name: Autolabeler

on:
  # pull_request_target (instead of pull_request) is required so the autolabeler
  # also works for pull requests opened from forks. It reads this workflow and
  # the config from the PR's base branch, so both must be on master to take effect.
  # No job checks out or runs code of the pull request.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no job checks out or runs pull request code
    types: [ opened, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read

jobs:
  autolabel:
    name: Autolabel the pull request
    # Label changes cannot change the result, only re-run the check below.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # apply labels via the autolabeler
    steps:
      - name: Autolabel the pull request
        uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required status check: every pull request needs a release label, so that it lands in
  # the right section of the release notes and bumps the right version part. The branch
  # prefix provides it automatically; otherwise a maintainer adds a label by hand.
  check-release-label:
    name: Check branch name or release label
    needs: autolabel
    if: ${{ !cancelled() && needs.autolabel.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read         # read .github/release-drafter.yml from the base commit
      pull-requests: read    # read the labels of the pull request
      issues: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Passed via env, never interpolated into the script: fork branch names are untrusted.
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Check branch name or release label
        run: |
          # The branch patterns and release labels come from .github/release-drafter.yml, so they cannot drift apart
          # from the autolabeler and the release notes categories. It is read from the base commit (like the
          # autolabeler reads it), so a pull request cannot change what it is checked against.
          CONFIG=$(gh api "repos/$GH_REPO/contents/.github/release-drafter.yml?ref=$BASE_SHA" -H "Accept: application/vnd.github.raw")

          # Autolabeler branch rules are JavaScript regexes like '/^feat\/.+/': strip the delimiting slashes and
          # unescape '\/' to get a bash regex. Rules without a branch (e.g. the body rule for "breaking") are skipped.
          mapfile -t BRANCH_PATTERNS < <(yq '.autolabeler[] | select(.branch) | .branch[]' <<< "$CONFIG")
          for i in "${!BRANCH_PATTERNS[@]}"; do
            pattern=${BRANCH_PATTERNS[$i]}
            if [[ ! "$pattern" =~ ^/(.+)/$ ]]; then
              echo "::error::Unsupported autolabeler branch pattern '$pattern' in .github/release-drafter.yml (expected /regex/ without flags)"
              exit 1
            fi
            BRANCH_PATTERNS[i]=$(sed 's|\\/|/|g' <<< "${BASH_REMATCH[1]}")
          done
          mapfile -t RELEASE_LABELS < <(yq '.categories[] | select(.when.labels) | .when.labels[]' <<< "$CONFIG")
          if (( ${#BRANCH_PATTERNS[@]} == 0 || ${#RELEASE_LABELS[@]} == 0 )); then
            echo "::error::Found no autolabeler branch patterns or no category labels in .github/release-drafter.yml"
            exit 1
          fi

          for pattern in "${BRANCH_PATTERNS[@]}"; do
            if [[ "$HEAD_REF" =~ $pattern ]]; then
              echo "Branch '$HEAD_REF' matches the naming convention ('$pattern')"
              exit 0
            fi
          done

          # Read the labels fresh: labels added by the autolabeler job are not part of the event payload.
          LABELS=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
          for label in "${RELEASE_LABELS[@]}"; do
            if grep -qxF "$label" <<< "$LABELS"; then
              echo "Branch '$HEAD_REF' does not match the naming convention, but the pull request has the release label '$label'"
              exit 0
            fi
          done

          echo "::error::Branch '$HEAD_REF' matches none of the branch patterns (${BRANCH_PATTERNS[*]}) and the pull request has none of the release labels (${RELEASE_LABELS[*]}). Either open the pull request from a branch named e.g. fix/<description>, or ask a maintainer to add a release label. See 'Branch naming' in CONTRIBUTING.md."
          exit 1
