name: Lint workflows

on:
  # No paths filter on pull requests: this job is a required status check, and a filtered-out workflow never
  # reports, which would leave every pull request that does not touch the workflows waiting for it.
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # Syntax, expressions, runner labels and shellcheck on run scripts.
      - name: actionlint
        run: uvx --from actionlint-py actionlint -color

      # Security audit: template injection, excessive permissions, unpinned actions, credential persistence, ...
      - name: zizmor
        run: uvx zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # enables zizmor's online audits (e.g. impostor commits)
