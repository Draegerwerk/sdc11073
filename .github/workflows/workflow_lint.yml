name: Lint workflows

on:
  # No paths filter on pull requests: this job is a required status check, and a filtered-out workflow never
  # reports, which would leave every pull request that does not touch the workflows waiting for it.
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "renovate.json5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      # actionlint and zizmor are pinned in the ci dependency group of uv.lock, so a new release (e.g. a new zizmor
      # audit) only takes effect through the Renovate pull request that updates it, not on unrelated pull requests.
      # Syntax, expressions, runner labels and shellcheck on run scripts.
      - name: actionlint
        run: uv run --locked --only-group ci actionlint -color

      # Security audit: template injection, excessive permissions, unpinned actions, credential persistence, ...
      - name: zizmor
        run: uv run --locked --only-group ci zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # enables zizmor's online audits (e.g. impostor commits)

      # The validator is not pinned on purpose: the hosted Renovate app always runs the latest Renovate, so the
      # configuration has to be valid for exactly that version.
      - name: renovate-config-validator
        uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          strict: "true"
