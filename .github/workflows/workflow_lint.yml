name: Lint workflows

on:
  # No paths filter on pull requests: this job is a required status check, and a filtered-out workflow never
  # reports, which would leave every pull request that does not touch the workflows waiting for it.
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Syntax, expressions, runner labels and shellcheck on run scripts.
      - name: actionlint
        run: uvx --from actionlint-py actionlint -color

      # Security audit: template injection, excessive permissions, unpinned actions, credential persistence, ...
      - name: zizmor
        run: uvx zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # enables zizmor's online audits (e.g. impostor commits)
