name: Run PAT tests
on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches:
      - master
      - v*

permissions:
  contents: read

# A new push to a pull request supersedes its running PAT tests; pushes to branches run per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdc11073_provider_v2:
    # Draft pull requests are tested once they are marked ready for review.
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-14, windows-latest ]
        tls_enable: [ true, false ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with tls ${{ matrix.tls_enable && 'enabled' || 'disabled' }}
        run: uv run -m pat.run ${{ matrix.tls_enable && '--tls' || '' }}
        timeout-minutes: 2
