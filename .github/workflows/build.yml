name: Build package

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp into the package."
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token. Empty for fork pull requests, which upload tokenless."
        required: false
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches:
      - master

permissions:
  contents: read

# A new push to a pull request supersedes its running build. Pushes to master and calls from
# publish.yml are grouped per commit and never canceled, so every commit on master gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml

      - name: ruff format check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
          args: "format --check --diff"

  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set new version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv version "$VERSION"

      - name: Build package
        run: uv build

      - name: Archive package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist
          retention-days: 5

  tests:
    needs: build
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest, windows-latest ]
        distribution: [ whl, tar_gz ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      REPORT_NAME: ${{ matrix.os }}_py${{ matrix.python-version }}_${{ matrix.distribution }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      # The test group depends on the package itself, so this installs it in editable mode first.
      # --locked fails instead of relocking if uv.lock is out of date, so the tests always run against the
      # committed uv.lock, which then documents the test environment.
      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Install package
        run: |
          case "$DISTRIBUTION" in
            whl) uv pip install dist/*.whl ;;
            tar_gz) uv pip install dist/*.tar.gz ;;
          esac

      # Guards against silently testing the editable source checkout instead of the built distribution.
      - name: Verify the built distribution is installed
        run: |
          uv run --no-sync python - <<'EOF'
          import json
          import pathlib
          from importlib.metadata import distribution

          import sdc11073

          direct_url = json.loads(distribution('sdc11073').read_text('direct_url.json') or '{}')
          print(f'sdc11073 imported from {pathlib.Path(sdc11073.__file__).parent}')
          print(f'direct_url.json: {direct_url}')
          if direct_url.get('dir_info', {}).get('editable'):
              raise SystemExit('sdc11073 is still installed in editable mode, not from the built distribution')
          EOF

      - name: Run pytest
        run: >-
          uv run --no-sync pytest
          -x
          -n logical
          --dist worksteal
          --durations=25
          --html="pytest_reports/unittest_report_${REPORT_NAME}.html"
          --self-contained-html
          --cov="$(uv run --no-sync python -c "import pathlib;import sdc11073;print(pathlib.Path(sdc11073.__file__).parent)")"
          --cov-report=xml
          --log-file "pytest_logs/${REPORT_NAME}/main.log"

      - name: Archive test result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}  # upload artifacts also if test stage failed
        with:
          name: unittest_reports-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.distribution }}
          path: pytest_reports/unittest_report_${{ env.REPORT_NAME }}*
          retention-days: 5

      - name: Archive test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}  # upload artifacts also if test stage failed
        with:
          name: pytest_logs-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.distribution }}
          path: pytest_logs/${{ env.REPORT_NAME }}/
          retention-days: 5

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single required status check for the whole test matrix, so the branch ruleset does not have to list every
  # combination. It must run even when tests fail or are skipped: a skipped required check counts as passed.
  tests-passed:
    name: tests passed
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check test matrix result
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::Test matrix result: $RESULT"
            exit 1
          fi
