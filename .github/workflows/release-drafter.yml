name: Release Drafter

on:
  # Triggered manually via the GitHub UI or API.
  workflow_dispatch:

  push:
    # Update the draft release whenever commits land on master.
    branches:
      - master

permissions:
  contents: read

# Shared with publish.yml: while a release is being published, draft updates wait until
# it has finished, so the draft (tag, notes) selected by the publish run cannot change
# underneath it. GitHub keeps only the newest pending run per group, which is fine here:
# every run rebuilds the whole draft, so a superseded update loses nothing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/update the draft release
      pull-requests: read    # read merged PRs (titles, authors, labels) to build the changelog
    steps:
      - name: Update the draft release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
